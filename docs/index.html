<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HPC Automation - FRM Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F8FAFC; color: #0F172A; padding: 32px 24px; }
    @media (max-width: 900px) { body { padding: 16px 12px; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      ComposedChart, Bar, Cell, XAxis, YAxis, CartesianGrid,
      Tooltip, ResponsiveContainer, ReferenceLine, LabelList,
    } = Recharts;

    // ── Constants ─────────────────────────────────────────────────────────────
    const RECALL     = 6621 / (6621 + 7856);
    const HC_PER_BPS = 560 / 317;
    const INC_PER_BPS = (4087 / 11) * (52 / 12);

    const rd  = v => Math.round(v * 10) / 10;
    const r1  = v => Math.round(v);
    const pct = v => `${(v * 100).toFixed(1)}%`;
    const hc  = bps => r1(bps * HC_PER_BPS);
    const inc = bps => {
      const n = r1(bps * INC_PER_BPS);
      return n >= 1000 ? `${(n / 1000).toFixed(1)}K` : `${n}`;
    };

    const FK_BLUE   = '#2874F0';
    const FK_YELLOW = '#FFE500';
    const CLR = {
      start:   FK_BLUE,
      total:   '#93C5FD',
      out:     '#EF4444',
      unknown: '#F97316',
      recall:  '#7C3AED',
      mpc:     '#94A3B8',
      current: FK_BLUE,
      add:     '#16A34A',
      target:  '#F59E0B',
    };

    // ── Waterfall builder ──────────────────────────────────────────────────────
    function buildWF(steps) {
      let running = 0;
      return steps.map(s => {
        let base, val;
        if (s.type === 'start' || s.type === 'current' || s.type === 'target') {
          base = 0; val = rd(s.bps); running = rd(s.bps);
        } else if (s.type === 'total') {
          base = 0; val = running;
        } else if (s.type === 'add') {
          base = running; val = rd(s.bps); running = rd(running + s.bps);
        } else {
          val = rd(s.bps); base = rd(running - val); running = base;
        }
        return { ...s, base, val, running };
      });
    }

    // ── Pre-computed values ────────────────────────────────────────────────────
    const CANT_SAY_BPS = rd(38  * (1 - RECALL));
    const CANT_SAY_126 = rd(126 * (1 - RECALL));
    const RECALL_CEIL  = rd(126 * RECALL);
    const OBD_GAIN     = rd(52  * RECALL);
    const MATCH_GAIN   = rd(7   * RECALL);
    const MPC_SOP      = rd(40 - 11 - OBD_GAIN - MATCH_GAIN);

    // ── Datasets ───────────────────────────────────────────────────────────────
    const funnelBars = buildWF([
      { name: 'OCR Bucket',     bps: 317,          type: 'start',   note: 'Total OCR-eligible returns · 560 HC' },
      { name: 'Rejected',       bps: 191,          type: 'out',     note: 'Rejection automation paused' },
      { name: 'Approved',                           type: 'total' },
      { name: 'Match Cohorts',  bps: 14,           type: 'out',     note: '5,543 cases - size/spec mismatch' },
      { name: 'MR Returns',     bps: 14,           type: 'out',     note: '5,582 cases - multi-rejection' },
      { name: 'OBD Missing',    bps: 52,           type: 'out',     note: '19,771 cases - OBD URL unavailable' },
      { name: 'OBD Available',                      type: 'total' },
      { name: 'Reason Sel.',    bps: 8,            type: 'unknown', note: '3,138 cases - Unknown sub-reason · SOP issue' },
      { name: 'AI Evaluatable',                     type: 'total' },
      { name: "Can't Say",      bps: CANT_SAY_BPS, type: 'recall',  note: `${pct(1 - RECALL)} cant-say · 7,856 cases` },
      { name: 'AI Reco',                            type: 'total' },
      { name: 'Control+MPC',    bps: 6,            type: 'mpc',     note: '~743 control (20%) + ~1,486 MPC cases' },
      { name: 'HPC Live',       bps: 11,           type: 'current', note: `4,087 cases/wk · ${inc(11)}/mo` },
    ]);

    const ceilBars = buildWF([
      { name: 'Approved',          bps: 126,          type: 'start',  note: 'Full AI scope' },
      { name: "Can't Say (−54%)",  bps: CANT_SAY_126, type: 'recall', note: `Ceiling = ${RECALL_CEIL} bps` },
      { name: 'Recall Ceiling',                        type: 'total' },
      { name: 'Control+MPC',       bps: 6,            type: 'mpc',    note: '6 bps deducted' },
      { name: 'HPC Ceiling',                           type: 'total' },
    ]);

    const pathBars = buildWF([
      { name: 'HPC Live',       bps: 11,         type: 'current', note: `4,087 cases/wk · ${inc(11)}/mo` },
      { name: 'OBD URL Fix',    bps: OBD_GAIN,   type: 'add',     note: `52 × ${pct(RECALL)} · 19,771 cases unblocked` },
      { name: 'Match Partial',  bps: MATCH_GAIN, type: 'add',     note: `~7 × ${pct(RECALL)}` },
      { name: 'MPC + SOP',      bps: MPC_SOP,    type: 'add',     note: 'SOP adherence + MPC expansion' },
      { name: 'JFM 40 bps',     bps: 40,         type: 'target',  note: `JFM target (in progress) · ${inc(40)}/mo` },
    ]);

    // ── Tooltip ────────────────────────────────────────────────────────────────
    function Tip({ active, payload }) {
      if (!active || !payload?.length) return null;
      const d = payload[0]?.payload;
      if (!d) return null;
      return (
        <div style={{ background:'white', border:'1px solid #E2E8F0', borderRadius:10, padding:'10px 14px', fontSize:12, maxWidth:260, boxShadow:'0 4px 12px rgba(0,0,0,0.1)' }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6 }}>
            <span style={{ width:10, height:10, borderRadius:3, background:CLR[d.type]??'#64748b', flexShrink:0 }} />
            <span style={{ fontWeight:700, color:'#0F172A' }}>{d.name}</span>
          </div>
          <p style={{ color:'#1E293B', margin:'2px 0', fontWeight:600 }}>
            {d.running} bps · {hc(d.running)} HC · {inc(d.running)}/mo
          </p>
          {d.note && <p style={{ color:'#64748B', marginTop:6, lineHeight:1.5, fontSize:11 }}>{d.note}</p>}
        </div>
      );
    }

    // ── Chart ──────────────────────────────────────────────────────────────────
    function WFChart({ data, height, yMax, refLines=[] }) {
      function BarLabel({ x, y, width, index }) {
        const d = data[index];
        if (!d || d.val === 0) return null;
        let label, color;
        if (d.type === 'add') { label = `+${rd(d.val)}`; color = CLR.add; }
        else if (['out','unknown','recall','mpc'].includes(d.type)) { label = `-${rd(d.val)}`; color = CLR[d.type]; }
        else { label = `${rd(d.val)}`; color = '#1E293B'; }
        return <text x={x+width/2} y={y-5} textAnchor="middle" fill={color} fontSize={10} fontWeight="700">{label}</text>;
      }
      return (
        <ResponsiveContainer width="100%" height={height}>
          <ComposedChart data={data} margin={{ top:30, right:24, left:10, bottom:80 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="#E2E8F0" vertical={false} />
            <XAxis dataKey="name" tick={{ fill:'#64748B', fontSize:11 }} interval={0} angle={-38} textAnchor="end" height={80} />
            <YAxis tick={{ fill:'#94A3B8', fontSize:11 }} unit=" bps" width={62} domain={[0,yMax]} tickLine={false} axisLine={false} />
            <Tooltip content={<Tip />} cursor={{ fill:'rgba(40,116,240,0.05)' }} />
            {refLines.map(rl => (
              <ReferenceLine key={rl.label} y={rl.y} stroke={rl.color} strokeDasharray="8 4" strokeWidth={1.5}
                label={{ value:rl.label, fill:rl.color, fontSize:10, position:'insideTopRight' }} />
            ))}
            <Bar dataKey="base" stackId="w" fill="transparent" isAnimationActive={false} />
            <Bar dataKey="val" stackId="w" maxBarSize={54} isAnimationActive={false}>
              {data.map((d,i) => <Cell key={i} fill={CLR[d.type]??'#64748b'} />)}
              <LabelList content={BarLabel} />
            </Bar>
          </ComposedChart>
        </ResponsiveContainer>
      );
    }

    // ── Legend ─────────────────────────────────────────────────────────────────
    const ALL_LEGEND = [
      { key:'start',   label:'Starting total' },
      { key:'total',   label:'Subtotal checkpoint' },
      { key:'out',     label:'Blocked / Excluded' },
      { key:'unknown', label:'Reason Selection (SOP)' },
      { key:'recall',  label:"Can't Say (recall loss)" },
      { key:'mpc',     label:'Control + MPC' },
      { key:'current', label:'Current live' },
      { key:'add',     label:'Improvement lever' },
      { key:'target',  label:'Target' },
    ];
    function Legend({ keys }) {
      const items = keys ? ALL_LEGEND.filter(l => keys.includes(l.key)) : ALL_LEGEND;
      return (
        <div style={{ display:'flex', flexWrap:'wrap', gap:'6px 18px', marginBottom:16 }}>
          {items.map(({ key, label }) => (
            <div key={key} style={{ display:'flex', alignItems:'center', gap:6, fontSize:11, color:'#64748B' }}>
              <span style={{ width:10, height:10, borderRadius:3, background:CLR[key], flexShrink:0 }} />
              {label}
            </div>
          ))}
        </div>
      );
    }

    // ── Stat card ──────────────────────────────────────────────────────────────
    function Stat({ label, value, sub, accent }) {
      return (
        <div style={{ borderRadius:12, border:'1px solid #E2E8F0', background:'white', padding:'16px 18px', boxShadow:'0 1px 3px rgba(0,0,0,0.06)' }}>
          <p style={{ fontSize:10, color:'#94A3B8', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:6 }}>{label}</p>
          <p style={{ fontSize:22, fontWeight:700, fontFamily:'monospace', color:accent??'#0F172A', margin:0 }}>{value}</p>
          {sub && <p style={{ fontSize:11, color:'#94A3B8', marginTop:5, lineHeight:1.5 }}>{sub}</p>}
        </div>
      );
    }

    // ── Section ────────────────────────────────────────────────────────────────
    function Section({ title, sub, accent, children }) {
      return (
        <div style={{ borderRadius:16, border:'1px solid #E2E8F0', background:'white', overflow:'hidden', boxShadow:'0 1px 3px rgba(0,0,0,0.06)' }}>
          <div style={{ padding:'18px 24px 14px', borderBottom:'1px solid #F1F5F9' }}>
            <div style={{ display:'flex', alignItems:'flex-start', gap:10 }}>
              {accent && <span style={{ width:4, borderRadius:2, background:accent, alignSelf:'stretch', flexShrink:0 }} />}
              <div>
                <h2 style={{ fontSize:14, fontWeight:600, color:'#0F172A', margin:0 }}>{title}</h2>
                {sub && <p style={{ fontSize:12, color:'#64748B', marginTop:5, lineHeight:1.6, maxWidth:800 }}>{sub}</p>}
              </div>
            </div>
          </div>
          <div style={{ padding:'18px 24px' }}>{children}</div>
        </div>
      );
    }

    // ── Page ───────────────────────────────────────────────────────────────────
    function HPCAutomation() {
      const kpis = [
        { label:'HPC Live',         value:'11 bps',  sub:`${hc(11)} HC · ${inc(11)}/mo`,                   accent:CLR.current },
        { label:'JFM Target (Q1)',  value:'40 bps',  sub:`${hc(40)} HC · ${inc(40)}/mo · in progress`,     accent:'#22d3ee' },
        { label:'AMJ End (Cumul.)', value:'80 bps',  sub:`${hc(80)} HC · ${inc(80)}/mo · cumul. by AMJ end`, accent:CLR.add },
        { label:'Cumul. Q1+Q2',     value:'80 bps',  sub:`${hc(80)} HC · ${inc(80)}/mo · 3-phase plan`,    accent:CLR.out },
        { label:'Model Recall',     value:pct(RECALL), sub:'reco ÷ (reco + cant-say)',                     accent:CLR.recall },
        { label:'Recall Ceiling',   value:`~${r1(RECALL_CEIL-6)} bps`, sub:`${hc(r1(RECALL_CEIL-6))} HC · ${inc(r1(RECALL_CEIL-6))}/mo`, accent:'#f472b6' },
      ];

      return (
        <div style={{ display:'flex', flexDirection:'column', gap:24, maxWidth:1400, margin:'0 auto' }}>
          <div>
            <h1 style={{ fontSize:24, fontWeight:700, color:'#0F172A', margin:'0 0 4px' }}>HPC Automation</h1>
            <p style={{ fontSize:13, color:'#64748B', margin:0 }}>
              Week 17 (Apr 22–26) · Recall = {pct(RECALL)} · Control = 20% · {hc(1)} HC/bps · {inc(1)}/mo per bps
            </p>
          </div>

          {/* Exec Summary */}
          <div style={{ borderRadius:16, border:`2px solid ${FK_BLUE}25`, background:'white', overflow:'hidden', boxShadow:'0 1px 4px rgba(0,0,0,0.07)' }}>
            <div style={{ padding:'14px 20px', background:`${FK_BLUE}0A`, borderBottom:`1px solid ${FK_BLUE}20`, display:'flex', alignItems:'center', gap:10 }}>
              <span style={{ width:4, borderRadius:2, background:FK_BLUE, alignSelf:'stretch', flexShrink:0 }} />
              <span style={{ fontSize:13, fontWeight:700, color:FK_BLUE, letterSpacing:'0.04em', textTransform:'uppercase' }}>Executive Summary</span>
              <span style={{ marginLeft:'auto', fontSize:11, color:'#94A3B8' }}>Week 17 · Apr 22–26, 2025</span>
            </div>
            <div style={{ padding:'18px 20px', display:'flex', flexDirection:'column', gap:16 }}>
              <p style={{ fontSize:13, color:'#334155', lineHeight:1.75, margin:0 }}>
                HPC automation is <strong style={{ color:'#0F172A' }}>live at 11 bps</strong> (4,087 cases/wk, Week 17), automating AI-driven approval decisions on OCR returns.
                The <strong style={{ color:'#0F172A' }}>JFM target is 40 bps</strong> - a 29 bps gap - fully closeable within current OCR approval scope via three execution levers.
                By <strong style={{ color:'#0F172A' }}>AMJ end, the cumulative target is 80 bps</strong>: Phase 1 gets to 40 bps; Phase 2 (rejection automation) and Phase 3 (non-OCR expansion) deliver the next 40 bps.
              </p>

              {/* Progress bar */}
              <div>
                <div style={{ display:'flex', justifyContent:'space-between', fontSize:10, color:'#94A3B8', marginBottom:6, textTransform:'uppercase', letterSpacing:'0.06em' }}>
                  <span>Current</span>
                  <span>JFM Target (Phase 1)</span>
                  <span>AMJ End Cumul. Target</span>
                </div>
                <div style={{ position:'relative', height:12, borderRadius:6, background:'#F1F5F9', overflow:'visible' }}>
                  <div style={{ position:'absolute', left:0, top:0, height:'100%', width:'50%', borderRadius:6, background:`${FK_BLUE}30` }} />
                  <div style={{ position:'absolute', left:0, top:0, height:'100%', width:`${(11/80)*100}%`, borderRadius:6, background:FK_BLUE }} />
                  <div style={{ position:'absolute', left:'50%', top:-3, width:2, height:18, background:CLR.add, borderRadius:1 }} />
                  <span style={{ position:'absolute', left:`${(11/80)*100}%`, top:16, transform:'translateX(-50%)', fontSize:10, fontWeight:700, color:FK_BLUE, whiteSpace:'nowrap' }}>11 bps ▲</span>
                  <span style={{ position:'absolute', left:'50%', top:16, transform:'translateX(-50%)', fontSize:10, fontWeight:700, color:CLR.add, whiteSpace:'nowrap' }}>40 bps</span>
                  <span style={{ position:'absolute', right:0, top:16, fontSize:10, fontWeight:700, color:'#94A3B8', whiteSpace:'nowrap' }}>80 bps</span>
                </div>
                <div style={{ height:28 }} />
              </div>

              {/* Three levers */}
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12 }}>
                {[
                  { phase:'Lever 1 - OBD URL Fix',   gain:`+${OBD_GAIN} bps`,  status:'Biggest unlock', statusColor:CLR.add, detail:`19,771 cases blocked by missing OBD URL. Engineering pipeline fix unblocks ${pct(RECALL)} of this cohort.` },
                  { phase:'Lever 2 - Match Cohorts',  gain:`+${MATCH_GAIN} bps`, status:'Quick win',      statusColor:CLR.add, detail:`~7 bps cohort partially automatable via MR route. DS to validate match positions.` },
                  { phase:'Lever 3 - MPC + SOP Fix',  gain:`+${MPC_SOP} bps`,   status:'Ops action',     statusColor:CLR.mpc, detail:`Sub-reason SOP adherence (8 bps Unknown) + MPC cohort expansion. Bridges to JFM 40 bps target.` },
                ].map(l => (
                  <div key={l.phase} style={{ background:'#F8FAFC', borderRadius:10, padding:'12px 14px', border:'1px solid #E2E8F0' }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:6 }}>
                      <span style={{ fontSize:10, color:'#64748B', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.06em' }}>{l.phase}</span>
                      <span style={{ fontSize:14, fontWeight:800, color:CLR.add, fontFamily:'monospace' }}>{l.gain}</span>
                    </div>
                    <p style={{ fontSize:11, color:l.statusColor, fontWeight:700, margin:'0 0 4px' }}>{l.status}</p>
                    <p style={{ fontSize:11, color:'#475569', margin:0, lineHeight:1.5 }}>{l.detail}</p>
                  </div>
                ))}
              </div>

              {/* Ceiling callouts */}
              <div style={{ display:'flex', gap:12 }}>
                <div style={{ flex:1, background:'#FDF4FF', borderRadius:10, padding:'10px 14px', border:'1px solid #E9D5FF' }}>
                  <span style={{ fontSize:10, color:CLR.recall, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em' }}>OCR Approval Ceiling</span>
                  <p style={{ fontSize:12, color:'#475569', margin:'4px 0 0', lineHeight:1.5 }}>
                    Model recall of <strong>{pct(RECALL)}</strong> creates a hard ceiling of ~{r1(RECALL_CEIL-6)} bps within current OCR scope.
                    Breaking past 52 bps requires model improvement or expanding the addressable universe.
                  </p>
                </div>
                <div style={{ flex:1, background:'#FFF7ED', borderRadius:10, padding:'10px 14px', border:'1px solid #FED7AA' }}>
                  <span style={{ fontSize:10, color:CLR.unknown, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em' }}>Path to 80 bps Cumulative</span>
                  <p style={{ fontSize:12, color:'#475569', margin:'4px 0 0', lineHeight:1.5 }}>
                    Phase 2 (rejection automation, <strong>191 bps</strong> addressable bucket, currently paused) and
                    Phase 3 (non-OCR expansion) open the remaining ~40 bps to hit the AMJ end target.
                  </p>
                </div>
              </div>
            </div>
          </div>

          {/* KPI strip */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(6,1fr)', gap:14 }}>
            {kpis.map(k => <Stat key={k.label} {...k} />)}
          </div>

          {/* Recall callout */}
          <div style={{ borderRadius:12, border:`1px solid ${FK_BLUE}30`, background:`${FK_BLUE}08`, padding:'14px 18px' }}>
            <p style={{ color:FK_BLUE, fontWeight:600, fontSize:13, margin:'0 0 6px' }}>
              Recall = AI reco to approve ÷ (AI reco + Can't say) = 6,621 ÷ 14,477 = {pct(RECALL)}
            </p>
            <p style={{ color:'#475569', fontSize:12, margin:0, lineHeight:1.6 }}>
              <span style={{ color:CLR.unknown, fontWeight:600 }}>Reason Selection (3,138 cases / 8 bps)</span> is "Unknown" sub-reason - SOP data quality issue, excluded from recall denominator.
              The 23.2% "Current AI-decision recall" in the pipeline sheet is end-to-end: HPC test ÷ OBD-available = 4,087 ÷ 17,615.
            </p>
          </div>

          {/* Funnel chart */}
          <Section
            title="Funnel - OCR Bucket → HPC Live"
            sub={`Exclusions first (Match, MR, OBD Missing, Reason Selection), then recall (${pct(RECALL)}) on 38 bps AI-evaluatable. 38 × 54.3% = 20.6 cant-say → 17 AI reco → 6 control+MPC (2 bps control @ 20%) → 11 HPC live.`}
            accent={CLR.start}
          >
            <Legend keys={['start','total','out','unknown','recall','mpc','current']} />
            <WFChart data={funnelBars} height={420} yMax={340} refLines={[
              { y:80, label:'AMJ end 80 bps (cumul.)',   color:CLR.out },
              { y:40, label:'JFM target 40 bps',         color:'#22d3ee' },
              { y:11, label:'Current 11 bps',            color:CLR.current },
            ]} />
          </Section>

          {/* Ceiling + Path */}
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
            <Section
              title="Recall-First Ceiling Analysis"
              sub={`Apply recall (${pct(RECALL)}) to full 126 bps approved → theoretical ceiling ${RECALL_CEIL} bps. After MPC/control deduction: ~52 bps (${hc(52)} HC · ${inc(52)}/mo). OCR approval scope has a hard ceiling - full 80 bps path requires rejection + non-OCR expansion.`}
              accent={CLR.recall}
            >
              <Legend keys={['start','recall','total','mpc']} />
              <WFChart data={ceilBars} height={300} yMax={140} refLines={[
                { y:80, label:'Cumul. 80 bps (Ph 1+2+3)', color:CLR.out },
                { y:40, label:'JFM target 40',             color:CLR.target },
              ]} />
            </Section>

            <Section
              title="Path to JFM 40 bps - OCR Approval Scope"
              sub={`OBD fix, match partial, and MPC+SOP levers get to 40 bps (JFM quarterly target, in progress). Phase 2 rejection automation and Phase 3 non-OCR expansion open the path to 80 bps cumulative by AMJ end.`}
              accent={CLR.add}
            >
              <Legend keys={['current','add','target']} />
              <WFChart data={pathBars} height={300} yMax={90} refLines={[
                { y:80, label:'Cumul. 80 bps (Ph 1+2+3)',  color:CLR.out },
                { y:52, label:'OCR approval ceiling ~52 bps', color:'#f472b6' },
                { y:40, label:'JFM target 40 bps',          color:CLR.target },
              ]} />
            </Section>
          </div>

          {/* Three-phase expansion */}
          <div style={{ borderRadius:12, border:'1px solid #E2E8F0', background:'white', padding:'16px 20px', boxShadow:'0 1px 3px rgba(0,0,0,0.06)' }}>
            <p style={{ color:'#0F172A', fontWeight:700, fontSize:14, margin:'0 0 12px' }}>Path to 80 bps - Three Phases of Automation Expansion</p>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14 }}>
              {[
                {
                  phase:'Phase 1 - OCR Approval HPC',
                  status:'40 bps achievable',
                  statusColor:CLR.target,
                  items:[`Fix OBD URL: +${OBD_GAIN} bps (${inc(OBD_GAIN)}/mo)`,`Match partial: +${MATCH_GAIN} bps (${inc(MATCH_GAIN)}/mo)`,`MPC + SOP: +${MPC_SOP} bps (${inc(MPC_SOP)}/mo)`],
                  note:'Ceiling ~52 bps with perfect data quality. Currently in progress.',
                },
                {
                  phase:'Phase 2 - Rejection Automation',
                  status:'191 bps available · sizing TBD',
                  statusColor:CLR.unknown,
                  items:['191 bps OCR bucket - largest single addressable opportunity','Precision-driven: model confidence thresholds determine safe automation rate','Re-enabling rejection pipeline could contribute significantly to 80 bps'],
                  note:'DS - rejection model precision eval · Ops - rejection SOP readiness.',
                },
                {
                  phase:'Phase 3 - Non-OCR / Non-OBD Expansion',
                  status:'incremental opportunity · sizing TBD',
                  statusColor:CLR.recall,
